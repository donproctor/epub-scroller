<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>EPUB Reader</title>

    <!-- The only library we need: reads ZIP files such as EPUBs -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            /* Prevents iOS from auto-bumping font sizes on rotation,
               which can throw off the width math independently of
               the font-size changes we make ourselves. */
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            background: #0000aa;
            color: #ffff00;
            font-family: "Courier New", monospace;
            height: 100vh;
            overflow: hidden;
        }

        #openScreen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 28px;
        }

        #reader {
            display: none;
            height: 100vh;
            width: 100%;
            padding: 20px;
        }

        #textPane {
            height: calc(100vh - 40px);
            width: 100%;
            max-width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            overflow-wrap: anywhere;
            /* Safari (especially iOS) doesn't always honor
               overflow-wrap: anywhere when white-space is pre-wrap.
               word-break: break-word is the older, more widely-
               respected property and acts as a fallback so long
               runs of text still wrap instead of overflowing. */
            word-break: break-word;
            font-size: 22px;
            line-height: 1.6;
            white-space: pre-wrap;
            cursor: default;
            padding: 30px;
            border: none;
            scrollbar-width: none;       /* Firefox */
            -ms-overflow-style: none;    /* old Edge */
        }

        #textPane::-webkit-scrollbar {
            display: none;               /* Chrome, Safari */
        }

        /*
         * On phone-sized screens, the reader's + textPane's combined
         * horizontal padding (20px + 30px = 50px per side) eats a
         * large chunk of a ~390px-wide screen. Shrink just the
         * horizontal padding down there — vertical padding is left
         * alone since #textPane's height is calculated from it
         * (see the calc(100vh - 40px) above).
         */
        @media (max-width: 480px) {

            #reader {
                padding-left: 6px;
                padding-right: 6px;
            }

            #textPane {
                padding-left: 8px;
                padding-right: 8px;
            }
        }

        #fileInput {
            display: none;
        }

        #status {
            position: fixed;
            bottom: 5px;
            right: 10px;
            font-size: 14px;
            background: #0000aa;
            color: #6666aa;
            opacity: 0.6;
        }

        /*
         * Invisible tap zones, for touchscreens and anywhere a
         * keyboard isn't handy. Nested inside #reader so they only
         * exist while a book is open (display:none hides descendants
         * too, so they never sit on top of the open screen).
         */
        .control-zone {
            position: fixed;
            z-index: 10;
            touch-action: manipulation;
        }

        #top-left {
            top: 0;
            left: 0;
            width: 25%;
            height: 12%;
        }

        #top-right {
            top: 0;
            right: 0;
            width: 25%;
            height: 12%;
        }

        #middle-zone {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            /* We handle dragging ourselves (see setupMiddleZone in the
               script), so tell the browser not to apply its own touch
               scrolling/gestures here — otherwise the two fight each
               other on iOS Safari and Chrome. */
            touch-action: none;
        }

        #bottom-left {
            bottom: 0;
            left: 0;
            width: 25%;
            height: 12%;
        }

        #bottom-right {
            bottom: 0;
            right: 0;
            width: 25%;
            height: 12%;
        }
    </style>
</head>

<body>

    <div id="openScreen">
        CLICK TO OPEN EPUB
    </div>

    <input id="fileInput" type="file" accept=".epub">

    <div id="reader">
        <div id="textPane" tabindex="-1"></div>

        <div id="top-left" class="control-zone"></div>
        <div id="top-right" class="control-zone"></div>
        <div id="middle-zone" class="control-zone"></div>
        <div id="bottom-left" class="control-zone"></div>
        <div id="bottom-right" class="control-zone"></div>
    </div>

    <div id="status"></div>

    <script>

        // ------------------------------------------------------------
        // Settings
        // ------------------------------------------------------------

        var scrollSpeed = 30;       // pixels per second
        var normalSpeed = 30;

        var minSpeed = 2;
        var maxSpeed = 120;
        var speedIncrement = 5;

        var fontSize = 22;          // matches #textPane's font-size in the CSS
        var minFont = 12;
        var maxFont = 48;
        var fontIncrement = 2;

        var running = false;

        var startTime = 0;
        var maxScrolltime = 3 * 60 * 1000;

        // Keep the scroll position separately as a floating-point number.
        // This allows smooth scrolling even when movement per frame
        // is less than one pixel.
        var scrollPosition = 0;

        // Identifies the currently-open book for bookmark storage.
        // Set in readEpub(); null until a book has been opened.
        var currentBookKey = null;

        // How many characters of the text at the top of the viewport
        // we store as the "bookmark" snippet.
        var bookmarkSnippetLength = 60;


        // ------------------------------------------------------------
        // Elements
        // ------------------------------------------------------------

        var openScreen = document.getElementById("openScreen");
        var fileInput = document.getElementById("fileInput");
        var reader = document.getElementById("reader");
        var textPane = document.getElementById("textPane");
        var status = document.getElementById("status");


        // ------------------------------------------------------------
        // Opening the file
        // ------------------------------------------------------------

        openScreen.onclick = function () {
            fileInput.click();
        };


        fileInput.onchange = function () {

            var file = fileInput.files[0];

            if (!file) {
                return;
            }

            readEpub(file);

            // Allow re-selecting the same file later.
            fileInput.value = "";
        };


        // ------------------------------------------------------------
        // Reflowing text
        //
        // Some EPUBs (older/converted ones especially) hard-wrap
        // their prose with a <br> at the end of every print line,
        // rather than relying on natural word-wrap. innerText turns
        // each of those into a real "\n", and since #textPane uses
        // white-space: pre-wrap (to preserve genuine paragraph
        // breaks), those old hard breaks get preserved too — so
        // lines stop wherever the original book happened to wrap,
        // regardless of the current screen width or font size.
        //
        // This collapses those single "soft" line breaks back into
        // spaces so the text can reflow naturally, while leaving
        // real paragraph breaks (blank lines) alone.
        // ------------------------------------------------------------

        function reflowText(text) {

            // Normalize any run of 3+ newlines down to a single
            // paragraph break, so the split below treats them
            // consistently.
            text = text.replace(/\n{3,}/g, "\n\n");

            var paragraphs = text.split(/\n\n/);

            paragraphs = paragraphs.map(function (paragraph) {

                // Collapse any leftover single line break — plus
                // whatever spaces/tabs sit around it — into one space.
                return paragraph
                    .replace(/[ \t]*\n[ \t]*/g, " ")
                    .trim();
            });

            return paragraphs.join("\n\n");
        }


        // ------------------------------------------------------------
        // Read an EPUB
        // ------------------------------------------------------------

        async function readEpub(file) {

            status.textContent = "Reading EPUB...";

            var zip = await JSZip.loadAsync(file);

            // Find the EPUB's container.xml
            var container = await zip
                .file("META-INF/container.xml")
                .async("text");

            var containerDoc = new DOMParser()
                .parseFromString(container, "application/xml");

            var rootFile =
                containerDoc
                    .querySelector("rootfile")
                    .getAttribute("full-path");


            // Read the OPF file
            var opf = await zip
                .file(rootFile)
                .async("text");

            var opfDoc = new DOMParser()
                .parseFromString(opf, "application/xml");


            // Directory containing the OPF file
            var opfDirectory = "";

            var slash = rootFile.lastIndexOf("/");

            if (slash >= 0) {
                opfDirectory = rootFile.substring(0, slash + 1);
            }


            // --------------------------------------------------------
            // Build a list of the book's files
            // --------------------------------------------------------

            var files = {};

            opfDoc.querySelectorAll("manifest item").forEach(function (item) {

                var id = item.getAttribute("id");
                var href = item.getAttribute("href");

                files[id] = href;
            });


            // --------------------------------------------------------
            // Find the reading order
            // --------------------------------------------------------

            var chapters = [];

            opfDoc.querySelectorAll("spine itemref").forEach(function (itemref) {

                var id = itemref.getAttribute("idref");

                if (files[id]) {
                    chapters.push(files[id]);
                }
            });


            // --------------------------------------------------------
            // Read every chapter
            // --------------------------------------------------------

            var completeText = "";

            for (var i = 0; i < chapters.length; i++) {

                var chapterPath =
                    opfDirectory + decodeURIComponent(chapters[i]);

                var chapter = zip.file(chapterPath);

                if (!chapter) {
                    continue;
                }

                var html = await chapter.async("text");

                var doc = new DOMParser()
                    .parseFromString(html, "text/html");


                // Remove things that aren't part of the readable text
                doc.querySelectorAll(
                    "script, style, nav, svg"
                ).forEach(function (element) {
                    element.remove();
                });


                var text = doc.body.innerText;

                completeText += text;
                completeText += "\n\n";
            }


            // --------------------------------------------------------
            // Identify this book for bookmark storage.
            //
            // There's no server and no stable id inside the EPUB
            // that's cheap to get at here, so filename + size is
            // the practical stand-in. Good enough to tell one book
            // from another on the same device/browser.
            // --------------------------------------------------------

            currentBookKey = "epub-bookmark:" + file.name + ":" + file.size;


            // --------------------------------------------------------
            // Display the book
            // --------------------------------------------------------

            textPane.textContent = reflowText(completeText.trim());

            openScreen.style.display = "none";
            reader.style.display = "block";

            textPane.scrollTop = 0;
            scrollPosition = 0;
            running = false;

            // Reader is now laid out, so geometry-based restoration
            // (getBoundingClientRect) will give real numbers.
            // Falls back to the top of the book if there's no
            // bookmark, or the snippet can no longer be found.
            restoreBookmark();

            // Move focus from the file input to the text pane.
            fileInput.blur();
            textPane.focus();

            updateStatus();
        }


        // ------------------------------------------------------------
        // Bookmarking
        //
        // The bookmark is just a short snippet of text taken from
        // whatever was at the top of the viewport when scrolling
        // last stopped. Since #textPane holds one continuous text
        // node, caretRangeFromPoint (or its Firefox equivalent,
        // caretPositionFromPoint) can tell us exactly which character
        // offset in that text node sits at a given pixel — no need
        // to walk elements or track our own offsets.
        // ------------------------------------------------------------

        function getCaretAtPoint(x, y) {

            if (document.caretRangeFromPoint) {

                var range = document.caretRangeFromPoint(x, y);

                if (!range) {
                    return null;
                }

                return { node: range.startContainer, offset: range.startOffset };
            }

            if (document.caretPositionFromPoint) {

                var position = document.caretPositionFromPoint(x, y);

                if (!position) {
                    return null;
                }

                return { node: position.offsetNode, offset: position.offset };
            }

            return null;
        }


        function saveBookmark() {

            console.log("[bookmark] saveBookmark() called, currentBookKey =", currentBookKey);

            if (!currentBookKey) {
                console.log("[bookmark] bailing: no currentBookKey");
                return;
            }

            var paneRect = textPane.getBoundingClientRect();

            // A couple of pixels inside the top edge, so we're
            // reliably over the text and not right on the boundary.
            var x = paneRect.left + paneRect.width / 2;
            var y = paneRect.top + 2;

            // #middle-zone sits visually on top of #textPane (that's
            // how taps get captured), which means caretRangeFromPoint
            // would otherwise "see" that empty div instead of the
            // text underneath it. Briefly step it out of the way.
            var middleZone = document.getElementById("middle-zone");
            var previousPointerEvents = middleZone.style.pointerEvents;
            middleZone.style.pointerEvents = "none";

            var caret = getCaretAtPoint(x, y);

            middleZone.style.pointerEvents = previousPointerEvents;

            console.log("[bookmark] paneRect =", paneRect, " x,y =", x, y, " caret =", caret);

            if (!caret) {
                console.log("[bookmark] bailing: getCaretAtPoint returned null (browser support issue, or point missed the text entirely)");
                return;
            }

            if (caret.node.nodeType !== Node.TEXT_NODE) {
                console.log("[bookmark] bailing: caret landed on a non-text node:", caret.node);
                return;
            }

            var text = caret.node.textContent;
            var snippet = text.substr(caret.offset, bookmarkSnippetLength);

            console.log("[bookmark] snippet =", JSON.stringify(snippet));

            // Too close to the end of the book to get a full-length
            // snippet — not worth saving, previous bookmark (if any)
            // is more useful than a too-short/ambiguous one.
            if (snippet.length < 20) {
                console.log("[bookmark] bailing: snippet too short (" + snippet.length + " chars)");
                return;
            }

            try {
                localStorage.setItem(
                    currentBookKey,
                    JSON.stringify({ snippet: snippet })
                );
                console.log("[bookmark] saved under key:", currentBookKey);
            } catch (error) {
                console.log("[bookmark] localStorage.setItem threw:", error);
            }
        }


        function restoreBookmark() {

            if (!currentBookKey) {
                return false;
            }

            var raw = localStorage.getItem(currentBookKey);

            if (!raw) {
                return false;
            }

            var data;

            try {
                data = JSON.parse(raw);
            } catch (error) {
                return false;
            }

            if (!data || !data.snippet) {
                return false;
            }

            var textNode = textPane.firstChild;

            if (!textNode || textNode.nodeType !== Node.TEXT_NODE) {
                return false;
            }

            var content = textNode.textContent;
            var index = content.indexOf(data.snippet);

            if (index < 0) {
                // Snippet no longer found (book re-parsed differently,
                // etc). Silently fall back to the top of the book.
                return false;
            }

            var range = document.createRange();
            range.setStart(textNode, index);
            range.setEnd(textNode, index + data.snippet.length);

            var rangeRect = range.getBoundingClientRect();
            var paneRect = textPane.getBoundingClientRect();

            // Shift scrollTop by however far the found text currently
            // sits from the top of the pane.
            textPane.scrollTop += (rangeRect.top - paneRect.top);
            scrollPosition = textPane.scrollTop;

            return true;
        }


        // ------------------------------------------------------------
        // Start / stop scrolling
        // ------------------------------------------------------------
        function toggleScrolling() {
            if (running) {
                stopScrolling();
            } else {
                startScrolling();
            }
        }


        function startScrolling() {

            var maxScroll =
                textPane.scrollHeight - textPane.clientHeight;


            // If we're already at the end, start again from the top.
            if (textPane.scrollTop >= maxScroll) {
                textPane.scrollTop = 0;
            }


            // Start our floating-point position at the actual
            // current scroll position.
            scrollPosition = textPane.scrollTop;

            running = true;

            // Use performance.now() for accurate animation timing.
            startTime = performance.now();

            scrollLoop.lastTime = startTime;

            requestAnimationFrame(scrollLoop);

            updateStatus();
        }


        // ------------------------------------------------------------
        // Animation loop
        // ------------------------------------------------------------

        function scrollLoop(now) {

            if (!running) {
                return;
            }


            // --------------------------------------------------------
            // Stop automatically after five minutes
            // --------------------------------------------------------
            if (now - startTime >= maxScrolltime) {
                stopScrolling();
                status.textContent = "Five minutes elapsed.";
                return;
            }


            // --------------------------------------------------------
            // Calculate time since the previous frame
            // --------------------------------------------------------
            var elapsed = now - scrollLoop.lastTime;

            scrollLoop.lastTime = now;


            // --------------------------------------------------------
            // Move according to speed
            //
            // scrollSpeed is pixels per second.
            //
            // Example:
            // 30 pixels/sec * 0.016 sec = 0.48 pixels
            // --------------------------------------------------------
            scrollPosition +=
                scrollSpeed * elapsed / 1000;

            textPane.scrollTop = scrollPosition;

            // --------------------------------------------------------
            // Stop at the end
            // --------------------------------------------------------
            var maxScroll =
                textPane.scrollHeight - textPane.clientHeight;

            if (scrollPosition >= maxScroll) {
                textPane.scrollTop = maxScroll;
                stopScrolling();
                status.textContent = "End of book.";

                return;
            }


            // --------------------------------------------------------
            // Request the next animation frame
            // --------------------------------------------------------
            requestAnimationFrame(scrollLoop);
        }

        // ------------------------------------------------------------
        // Stop scrolling
        //
        // This is the natural "scrolling has stopped" event: it fires
        // whether stopping was caused by the five-minute timeout, the
        // end of the book, or the user pausing manually (space / tap).
        // That makes it the right place to save the bookmark.
        // ------------------------------------------------------------
        function stopScrolling() {
            running = false;
            scrollLoop.lastTime = null;
            updateStatus();
            saveBookmark();
        }

        // ------------------------------------------------------------
        // Speed
        // ------------------------------------------------------------
        function increaseSpeed() {
            scrollSpeed += speedIncrement;

            if (scrollSpeed > maxSpeed) {
                scrollSpeed = maxSpeed;
            }

            // Speeding up implies you want to be reading, so start
            // scrolling if it was paused.
            if (!running) {
                startScrolling();
            } else {
                updateStatus();
            }
        }


        function decreaseSpeed() {
            scrollSpeed -= speedIncrement;

            if (scrollSpeed < minSpeed) {
                scrollSpeed = minSpeed;
            }

            updateStatus();
        }


        // ------------------------------------------------------------
        // Font size
        // ------------------------------------------------------------

        function increaseFontSize() {
            fontSize += fontIncrement;

            if (fontSize > maxFont) {
                fontSize = maxFont;
            }

            textPane.style.fontSize = fontSize + "px";
            updateStatus();
        }


        function decreaseFontSize() {
            fontSize -= fontIncrement;

            if (fontSize < minFont) {
                fontSize = minFont;
            }

            textPane.style.fontSize = fontSize + "px";
            updateStatus();
        }


        // ------------------------------------------------------------
        // Status display
        // ------------------------------------------------------------

        function updateStatus() {

            status.textContent =
                (running ? "PLAYING" : "PAUSED") +
                "   SPEED: " + scrollSpeed +
                "   FONT: " + fontSize +
                "   SPACE: play/pause   ↑↓: speed";
        }


        // ------------------------------------------------------------
        // Keyboard
        // ------------------------------------------------------------

        document.addEventListener("keydown", function (event) {

            switch (event.code) {

                // Space = play/pause
                case "Space":

                    event.preventDefault();

                    toggleScrolling();

                    break;


                // Up arrow = faster
                case "ArrowUp":

                    event.preventDefault();

                    increaseSpeed();

                    break;


                // Down arrow = slower
                case "ArrowDown":

                    event.preventDefault();

                    decreaseSpeed();

                    break;
            }
        });


        // ------------------------------------------------------------
        // Tap zones (touch, mouse, or pen)
        // ------------------------------------------------------------

        /*
         * Wires up a zone so that "action" runs only on a genuine tap
         * (pointer goes down and up again close to the same spot) —
         * not when a finger drags across the zone.
         */
        function setupZone(zoneId, action) {

            var zone = document.getElementById(zoneId);

            var startX = 0;
            var startY = 0;
            var dragThreshold = 15;

            zone.addEventListener("pointerdown", function (event) {
                startX = event.clientX;
                startY = event.clientY;
            });

            zone.addEventListener("pointerup", function (event) {

                var deltaX = Math.abs(event.clientX - startX);
                var deltaY = Math.abs(event.clientY - startY);

                if (deltaX < dragThreshold && deltaY < dragThreshold) {
                    action();
                }
            });
        }

        setupZone("top-left", increaseFontSize);
        setupZone("bottom-left", decreaseFontSize);
        setupZone("top-right", increaseSpeed);
        setupZone("bottom-right", decreaseSpeed);


        /*
         * The middle zone needs to do two things instead of one:
         * a short tap toggles play/pause (as before), but a drag
         * should scroll the text underneath by the same distance
         * the finger/pointer moves. Native touch scrolling can't do
         * this on its own because the zone (not the text) is what
         * actually receives the touch — see the #middle-zone
         * touch-action comment in the CSS above.
         */
        function setupMiddleZone() {

            var zone = document.getElementById("middle-zone");

            var startY = 0;
            var startScrollTop = 0;
            var dragThreshold = 15;
            var dragging = false;
            var pointerIsDown = false;
            var wasRunningBeforeDrag = false;

            zone.addEventListener("pointerdown", function (event) {

                startY = event.clientY;
                startScrollTop = textPane.scrollTop;
                dragging = false;
                pointerIsDown = true;
                wasRunningBeforeDrag = running;

                try {
                    zone.setPointerCapture(event.pointerId);
                } catch (error) {
                    // Pointer capture isn't available in every browser;
                    // dragging still works without it.
                }
            });

            zone.addEventListener("pointermove", function (event) {

                // On mice/trackpads, pointermove fires continuously
                // just from hovering — not only while a button is
                // held. Without this check, moving the cursor at any
                // point after a click would be misread as a drag,
                // using that old click's position as the drag origin.
                if (!pointerIsDown) {
                    return;
                }

                var deltaY = event.clientY - startY;

                if (!dragging && Math.abs(deltaY) > dragThreshold) {

                    dragging = true;

                    // A real drag takes over from auto-scroll.
                    if (wasRunningBeforeDrag) {
                        stopScrolling();
                    }
                }

                if (dragging) {

                    event.preventDefault();

                    // Dragging up reveals content further down the
                    // book, same as a native scroll gesture.
                    textPane.scrollTop = startScrollTop - deltaY;
                    scrollPosition = textPane.scrollTop;
                }
            });

            zone.addEventListener("pointerup", function (event) {

                pointerIsDown = false;

                if (dragging) {
                    dragging = false;
                    saveBookmark();
                } else {
                    // Pointer never moved past the threshold: a tap.
                    toggleScrolling();
                }

                try {
                    zone.releasePointerCapture(event.pointerId);
                } catch (error) {
                    // Nothing to release.
                }
            });

            zone.addEventListener("pointercancel", function () {
                pointerIsDown = false;
                dragging = false;
            });
        }

        setupMiddleZone();


        // ------------------------------------------------------------
        // Manual mouse-wheel scrolling stops auto-scroll.
        // The middle zone sits on top of textPane (so taps anywhere
        // in the reading area toggle play/pause), which means wheel
        // events land on the zone instead of textPane directly — so
        // we forward the scroll ourselves.
        // ------------------------------------------------------------

        var wheelBookmarkTimer = null;

        document.getElementById("middle-zone").addEventListener(
            "wheel",
            function (event) {

                event.preventDefault();

                textPane.scrollTop += event.deltaY;
                scrollPosition = textPane.scrollTop;

                if (running) {
                    // stopScrolling() already saves the bookmark.
                    stopScrolling();
                } else {
                    // Already paused and manually scrolling — there's
                    // no natural "stopped" event to hang onto here,
                    // so approximate one: save a little while after
                    // the wheel goes quiet.
                    clearTimeout(wheelBookmarkTimer);
                    wheelBookmarkTimer = setTimeout(saveBookmark, 400);
                }
            },
            { passive: false }
        );


        // ------------------------------------------------------------
        // Safety net: also save if the tab is hidden or the page is
        // being closed, in case that happens mid-scroll without one
        // of the above "stopped" events having fired yet.
        // ------------------------------------------------------------

        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                saveBookmark();
            }
        });

        window.addEventListener("pagehide", saveBookmark);


        // ------------------------------------------------------------
        // Initial status
        // ------------------------------------------------------------

        updateStatus();

    </script>

</body>
</html>
